
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PJT CLASSES</title>

    <link rel="stylesheet" href="../css/auth.css">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f7fb;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(9, 37, 75, 0.10);
        }

        .reset-card h1 {
            margin: 0 0 10px;
            color: #09254b;
            font-size: 26px;
        }

        .reset-card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .reset-card label {
            display: block;
            margin: 16px 0 8px;
            color: #09254b;
            font-weight: 600;
        }

        .reset-card input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border: 1px solid #d5deea;
            border-radius: 8px;
            font-size: 15px;
        }

        .reset-card button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0864f7;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-card button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #resetMessage {
            margin-top: 16px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0864f7;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="reset-page">
        <section class="reset-card">
            <h1>Reset Your Password</h1>
            <p>Choose a new password for your PJT CLASSES student account.</p>

            <form id="resetPasswordForm">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmNewPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Re-enter new password"
                    required
                >

                <button type="submit" id="resetSubmitButton">
                    Update Password
                </button>

                <p id="resetMessage" role="status" aria-live="polite"></p>
            </form>

            <a class="back-login" href="login.html">
                Back to Student Login
            </a>
        </section>
    </main>

    <script src="../js/supabase.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
