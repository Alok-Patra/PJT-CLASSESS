<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PJT Classes Student Registration"
    >

    <title>Student Registration | PJT Classes</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>

<body>

<div class="auth-page register-page">

    <!-- ==================================================
         DESKTOP BRAND SIDE
    ================================================== -->

    <section class="brand-side">

        <div class="brand-content">

            <a
                href="login.html"
                class="brand-logo"
            >

                <img
                    src="../assets/images/logo/logo.png"
                    alt="PJT Classes"
                >

            </a>


            <div class="brand-message">

                <span class="brand-badge">
                    STUDENT REGISTRATION
                </span>

                <h1>
                    Start Your
                    <strong>Journey.</strong>
                </h1>

                <p>
                    Create your student account and
                    stay connected with your academic
                    progress at PJT Classes.
                </p>

            </div>


            <div class="brand-quote">

                <span class="quote-line"></span>

                <p>
                    "Every journey begins<br>
                    with a first step."
                </p>

            </div>

        </div>

    </section>


    <!-- ==================================================
         FORM SIDE
    ================================================== -->

    <section class="form-side">

        <!-- MOBILE LOGO -->

        <div class="mobile-logo">

            <img
                src="../assets/images/logo/logo.png"
                alt="PJT Classes"
            >

        </div>


        <!-- REGISTRATION CARD -->

        <div class="auth-card register-card">

            <div class="auth-header">

                <div class="auth-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <circle
                            cx="12"
                            cy="8"
                            r="3.3"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <path
                            d="M5 20C5.8 16.5 8.1 14.5 12 14.5C15.9 14.5 18.2 16.5 19 20"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <path
                            d="M19 5V10"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <path
                            d="M16.5 7.5H21.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                    </svg>

                </div>

                <h2>
                    Create Account
                </h2>

                <p>
                    Register your student account
                </p>

            </div>


            <!-- FORM -->

            <form
                id="registerForm"
                novalidate
            >

                <!-- NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M5 20C5.8 16.5 8.1 14.5 12 14.5C15.9 14.5 18.2 16.5 19 20"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </span>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <span
                        class="error"
                        id="fullNameError"
                    ></span>

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <rect
                                    x="7"
                                    y="3"
                                    width="10"
                                    height="18"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M10 18H14"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </span>

                        <input
                            type="tel"
                            id="mobileNumber"
                            placeholder="Enter mobile number"
                            maxlength="10"
                            autocomplete="tel"
                            required
                        >

                    </div>

                    <span
                        class="error"
                        id="mobileError"
                    ></span>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                        <small>(Optional)</small>
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M4 7L12 13L20 7"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                        >

                    </div>

                    <span
                        class="error"
                        id="emailError"
                    ></span>

                </div>


                <!-- CLASS -->

                <div class="form-group">

                    <label for="studentClass">
                        Class
                    </label>

                    <div class="input-wrapper select-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <rect
                                    x="4"
                                    y="5"
                                    width="16"
                                    height="15"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M8 9H16"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M8 13H14"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </span>

                        <select
                            id="studentClass"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select your class
                            </option>

                            <option value="6">
                                Class 6
                            </option>

                            <option value="7">
                                Class 7
                            </option>

                            <option value="8">
                                Class 8
                            </option>

                            <option value="9">
                                Class 9
                            </option>

                            <option value="10">
                                Class 10
                            </option>

                            <option value="11">
                                Class 11
                            </option>

                            <option value="12">
                                Class 12
                            </option>

                        </select>

                        <span class="select-arrow">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <path
                                    d="M6 9L12 15L18 9"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </span>

                    </div>

                    <span
                        class="error"
                        id="classError"
                    ></span>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </span>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="registerPasswordToggle"
                            aria-label="Show password"
                        >

                            <svg
                                class="eye-open"
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <path
                                    d="M2.5 12C4.5 8.2 7.8 6 12 6C16.2 6 19.5 8.2 21.5 12C19.5 15.8 16.2 18 12 18C7.8 18 4.5 15.8 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.7"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                />

                            </svg>

                            <svg
                                class="eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <path
                                    d="M3 3L21 21"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 6.2C11.05 6.07 11.51 6 12 6C16.2 6 19.5 8.2 21.5 12"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </button>

                    </div>

                    <span
                        class="error"
                        id="registerPasswordError"
                    ></span>

                </div>


                <!-- CONFIRM -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <path
                                    d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <span
                        class="error"
                        id="confirmPasswordError"
                    ></span>

                </div>


                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <span class="checkbox"></span>

                    <span>
                        I agree to the
                        <a href="#">
                            terms and conditions
                        </a>
                    </span>

                </label>

                <span
                    class="error terms-error"
                    id="termsError"
                ></span>


                <!-- MESSAGE -->

                <div
                    class="form-message"
                    id="registerMessage"
                ></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >

                    <span>
                        Create Account
                    </span>

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="switch-auth">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <!-- FOOTER -->

            <div class="auth-footer">

                <span>
                    PJT Classes Student Portal
                </span>

                <i></i>

                <span>
                    Secure Access
                </span>

            </div>

        </div>

    </section>

</div>


<script src="../js/auth.js"></script>

</body>

</html>
